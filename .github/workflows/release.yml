name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Package and release
        uses: BigWigsMods/packager@v2
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          # Optional. Set these repository secrets to publish automatically;
          # without them the packager just attaches the zip to the GitHub
          # release. Publishing to CurseForge would additionally need a
          # CF_API_KEY secret and ## X-Curse-Project-ID in the .toc; neither
          # exists, so that path is deliberately not wired up.
          WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
