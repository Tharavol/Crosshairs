name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.1"

      - uses: leafo/gh-actions-luarocks@v6

      - name: Install luacheck
        run: luarocks install luacheck

      - name: Luacheck
        run: luacheck .

      # Catches a .toc listing a file that doesn't exist, or that differs only in case.
      # Both load silently in-game with no error, and the case variant only shows up on a
      # case-sensitive filesystem -- which is what this runner is and a player's is not.
      - name: Validate TOC
        run: lua scripts/validate-toc.lua

      # Runs the addon against a stubbed WoW API. luacheck catches unknown globals and
      # unused locals but not runtime shape errors -- this catches those instead.
      - name: Run tests
        run: lua tests/run_tests.lua
