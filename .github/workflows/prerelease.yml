name: Pre-release

on:
  push:
    tags:
      # alpha/beta only: packager itself reads "alpha"/"beta" out of the tag
      # name to decide the GitHub release's prerelease flag (and, later, the
      # CurseForge release channel), so tags need one of those words in them
      # to get that treatment. Anything else (e.g. -rc.1) would still build
      # and publish here, just without that automatic classification.
      - "v[0-9]+.[0-9]+.[0-9]+-alpha*"
      - "v[0-9]+.[0-9]+.[0-9]+-beta*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # No CF_API_KEY here, deliberately, matching release.yml -- this addon
      # isn't wired up to CurseForge at all yet, and even after it is for
      # stable releases, this job still won't touch it, since packager only
      # uploads to a destination when its token env var is present.
      - name: Package and release
        uses: BigWigsMods/packager@v2
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}

      - name: Verify archive layout
        run: |
          zip=$(ls .release/*.zip)
          unzip -l "$zip"
          unzip -l "$zip" | grep -q 'Crosshairs/Crosshairs.toc'
          unzip -l "$zip" | grep -q 'Crosshairs/Core.lua'
          unzip -l "$zip" | grep -q 'Crosshairs/Circle.lua'
          unzip -l "$zip" | grep -q 'Crosshairs/Cross.lua'
          unzip -l "$zip" | grep -q 'Crosshairs/Options.lua'
          unzip -l "$zip" | grep -q 'Crosshairs/Slash.lua'

          if unzip -l "$zip" | grep -q 'Crosshairs/tests/'; then
            echo "tests/ should not ship in the release archive (see .pkgmeta)" >&2
            exit 1
          fi
          if unzip -l "$zip" | grep -q 'Crosshairs/CHANGELOG.md'; then
            echo "CHANGELOG.md should not ship in the release archive (see .pkgmeta)" >&2
            exit 1
          fi
